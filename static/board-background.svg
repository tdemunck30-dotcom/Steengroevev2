<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-label="A quarry game board style background">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8db7ea"/>
      <stop offset="100%" stop-color="#b9d5f4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ead8b4"/>
      <stop offset="100%" stop-color="#c89e6d"/>
    </linearGradient>
    <linearGradient id="boardFace" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d8ccb5"/>
      <stop offset="100%" stop-color="#cbbda4"/>
    </linearGradient>
    <linearGradient id="boardHead" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cfc3ac"/>
      <stop offset="100%" stop-color="#b9ae99"/>
    </linearGradient>
    <linearGradient id="crateRed" x1="0" x2="1" y1="0" y2="1">
