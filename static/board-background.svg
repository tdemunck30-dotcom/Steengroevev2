      <ellipse cx="56" cy="92" rx="44" ry="30" fill="#a77b53"/>
      <ellipse cx="126" cy="102" rx="34" ry="24" fill="#8d6848"/>
      <ellipse cx="24" cy="150" rx="30" ry="22" fill="#7a593d"/>
      <ellipse cx="84" cy="152" rx="38" ry="28" fill="#b3885d"/>
      <ellipse cx="151" cy="147" rx="32" ry="24" fill="#8d6a48"/>
      <path d="M8 116c16-18 42-25 58-8s11 35-5 47-45 16-58-8 3-23 5-31Z" fill="#9a734d"/>
