<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Cat with impossible anatomy</title>
  <desc id="desc">A stylized living room scene with a cat that has too many legs and two tails.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dad3ca"/>
      <stop offset="100%" stop-color="#bfb4a9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8f6c55"/>
      <stop offset="100%" stop-color="#6d503f"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="525" width="1200" height="275" fill="url(#floor)"/>
  <circle cx="980" cy="150" r="56" fill="#f5ead1" opacity="0.46"/>
  <rect x="110" y="160" width="208" height="248" rx="20" fill="#efe8de" stroke="#c0b3a6" stroke-width="14"/>
  <rect x="132" y="182" width="164" height="204" rx="12" fill="#9dc1d2"/>
  <path d="M132 312 C178 256 232 242 296 196 V386 H132 Z" fill="#7aa36f" opacity="0.54"/>

  <g transform="translate(222 372)">
