    <path d="M236 198 C240 270 248 334 258 392" fill="none" stroke="#c48758" stroke-width="24" stroke-linecap="round"/>
    <path d="M318 194 C330 268 334 332 338 392" fill="none" stroke="#c48758" stroke-width="24" stroke-linecap="round"/>
    <path d="M398 176 C426 244 440 312 446 386" fill="none" stroke="#c48758" stroke-width="24" stroke-linecap="round"/>

