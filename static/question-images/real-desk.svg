    <rect x="8" y="12" width="52" height="98" rx="10" fill="#f5f1eb"/>
    <rect x="18" y="8" width="6" height="96" fill="#ef5d5d"/>
    <rect x="30" y="8" width="6" height="94" fill="#f2c14e"/>
    <rect x="42" y="8" width="6" height="92" fill="#5fa4d9"/>
