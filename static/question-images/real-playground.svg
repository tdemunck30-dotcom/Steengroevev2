<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">School playground</title>
  <desc id="desc">A stylized school playground with swings, a bench and a backpack arranged consistently.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d8eefb"/>
      <stop offset="100%" stop-color="#94c8e4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d3b08c"/>
      <stop offset="100%" stop-color="#bb9168"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.74" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="946" cy="144" r="48" fill="#fff0ae"/>
  <rect x="0" y="520" width="1200" height="280" fill="url(#ground)"/>

  <rect x="106" y="240" width="428" height="280" fill="#d9cab6"/>
  <rect x="146" y="284" width="346" height="236" fill="#ede7de"/>
  <rect x="190" y="330" width="88" height="110" fill="#8cb8d5"/>
  <rect x="304" y="330" width="88" height="110" fill="#8cb8d5"/>
  <rect x="418" y="330" width="40" height="190" fill="#b58865"/>
  <rect x="126" y="264" width="392" height="28" fill="#b48764"/>

  <g transform="translate(714 260)">
    <path d="M0 250 L72 0" stroke="#516778" stroke-width="18" stroke-linecap="round"/>
    <path d="M250 250 L178 0" stroke="#516778" stroke-width="18" stroke-linecap="round"/>
    <path d="M70 0 H180" stroke="#516778" stroke-width="18" stroke-linecap="round"/>
    <path d="M98 48 V176" stroke="#424f5a" stroke-width="8" stroke-linecap="round"/>
    <path d="M148 48 V176" stroke="#424f5a" stroke-width="8" stroke-linecap="round"/>
    <rect x="72" y="176" width="102" height="18" rx="9" fill="#d07a4d"/>
  </g>

  <g transform="translate(186 574)">
    <rect x="0" y="0" width="132" height="16" rx="8" fill="#805c41"/>
    <rect x="18" y="16" width="16" height="64" rx="8" fill="#6b4c35"/>
    <rect x="98" y="16" width="16" height="64" rx="8" fill="#6b4c35"/>
  </g>

  <g transform="translate(930 602)">
    <path d="M0 62 C0 22 24 0 70 0 C116 0 140 22 140 62 V138 H0 Z" fill="#c85151"/>
    <rect x="42" y="28" width="56" height="18" rx="9" fill="#f0cfcf"/>
    <path d="M24 48 C24 20 40 4 70 4 C100 4 116 20 116 48" fill="none" stroke="#a53f3f" stroke-width="12" stroke-linecap="round"/>
  </g>

  <path d="M674 610 C754 590 860 590 950 610" fill="none" stroke="#826145" stroke-width="14" opacity="0.2"/>
  <path d="M160 648 C220 634 286 634 340 648" fill="none" stroke="#826145" stroke-width="14" opacity="0.2"/>

  <rect width="1200" height="800" fill="#ffffff" opacity="0.06" filter="url(#grain)"/>
