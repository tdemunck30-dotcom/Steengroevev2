  <rect x="442" y="320" width="240" height="135" fill="#d8af86"/>
  <polygon points="420,320 560,268 703,320" fill="#2d5e79"/>
  <rect x="790" y="338" width="230" height="117" fill="#efc49b"/>
  <polygon points="771,338 907,286 1040,338" fill="#d96444"/>

  <rect x="74" y="615" width="1052" height="8" fill="#cda17d" opacity="0.55"/>
  <rect x="40" y="640" width="1120" height="10" fill="#3f2f27" opacity="0.3"/>

  <g transform="translate(645 520)">
