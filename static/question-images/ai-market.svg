<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Market street with impossible bicycle</title>
  <desc id="desc">A stylized market scene with a bicycle that has too many front wheels and a hand with too many fingers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7d8b2"/>
      <stop offset="58%" stop-color="#f5b37f"/>
      <stop offset="100%" stop-color="#d6774f"/>
    </linearGradient>
    <linearGradient id="street" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8c6a54"/>
      <stop offset="100%" stop-color="#584134"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect y="470" width="1200" height="330" fill="url(#street)"/>

  <rect x="0" y="210" width="200" height="290" fill="#7b5642"/>
  <rect x="165" y="170" width="220" height="330" fill="#935f47"/>
  <rect x="350" y="120" width="210" height="380" fill="#6f4850"/>
